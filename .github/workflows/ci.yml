name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash examples/demo.sh
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python -m pip install --target /tmp/installed /tmp/wheels/*.whl
      - run: |
          python -m scanlab demo >/tmp/source-demo.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab demo) >/tmp/wheel-demo.json
          cmp /tmp/source-demo.json /tmp/wheel-demo.json
          python -m scanlab audit examples/input.json >/tmp/source-audit.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab audit "$GITHUB_WORKSPACE/examples/input.json") >/tmp/wheel-audit.json
          cmp /tmp/source-audit.json /tmp/wheel-audit.json
