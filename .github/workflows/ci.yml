name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash examples/demo.sh
      - run: bash examples/adjoint-demo.sh
      - run: bash examples/dense-demo.sh
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python -m pip install --target /tmp/installed /tmp/wheels/*.whl
      - run: |
          python -m scanlab demo >/tmp/source-demo.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab demo) >/tmp/wheel-demo.json
          cmp /tmp/source-demo.json /tmp/wheel-demo.json
          python -m scanlab audit examples/input.json >/tmp/source-audit.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab audit "$GITHUB_WORKSPACE/examples/input.json") >/tmp/wheel-audit.json
          cmp /tmp/source-audit.json /tmp/wheel-audit.json
          python -m scanlab adjoint-demo >/tmp/source-adjoint-demo.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab adjoint-demo) >/tmp/wheel-adjoint-demo.json
          cmp /tmp/source-adjoint-demo.json /tmp/wheel-adjoint-demo.json
          python -m scanlab adjoint examples/adjoint-input.json >/tmp/source-adjoint.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab adjoint "$GITHUB_WORKSPACE/examples/adjoint-input.json") >/tmp/wheel-adjoint.json
          cmp /tmp/source-adjoint.json /tmp/wheel-adjoint.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -c "import scanlab, scanlab.__main__, scanlab.demo, scanlab.exact, scanlab.floating, scanlab.gated, scanlab.lti, scanlab.adjoint; print('8 modules imported')")
          python -m scanlab dense-demo >/tmp/source-dense-demo.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab dense-demo) >/tmp/wheel-dense-demo.json
          cmp /tmp/source-dense-demo.json /tmp/wheel-dense-demo.json
          python -m scanlab dense examples/dense-input.json >/tmp/source-dense.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m scanlab dense "$GITHUB_WORKSPACE/examples/dense-input.json") >/tmp/wheel-dense.json
          cmp /tmp/source-dense.json /tmp/wheel-dense.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -c "import scanlab.dense; print('9 modules imported across package checks')")
