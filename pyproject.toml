[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scanlab"
version = "0.2.0"
description = "Exact affine prefix scans and inspectable gated state-space derivatives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["scanlab*"]
