<text x="40" y="1430" class="note">Dense dot products count all entries, including zeros; no diagonal/zero-skipping optimization.</text>
<text x="40" y="1460" class="note">Span treats a whole matrix pair operation as one unit. Derivative setup and bit complexity are excluded.</text>
