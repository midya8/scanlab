<text x="40" y="56" class="title">ScanLab / reverse scans and exact derivative certificates</text>
<text x="40" y="88" class="note">Supplied rational affine pairs. No dense Jacobian/Hessian. Serial Python, not GPU timing.</text>
<text x="40" y="136" class="section">1  Reverse time is not enough: shift the decay by one step</text>
<text x="40" y="167" class="note">h[t] = a[t] h[t-1] + b[t]; lambda[t] = q[t] + a[t+1] lambda[t+1]</text>
<text x="40" y="195" class="note">Tangent: dh[t] = a[t] dh[t-1] + da[t] h[t-1] + db[t]</text>
